# main links
# NOTE: every url below must match an explicit `<span class="anchor" id="...">`
# in _pages/about.md. Do NOT point at Kramdown's auto-generated heading ids --
# the icon <span> inside each heading makes them render as "-about-me", "-service"
# etc. (leading hyphen), which is why the old #summary/#skills/#photos links were
# silently dead.
main:
  - title: "About"
    url: "/#about-me"

  - title: "Experience"
    url: "/#experience"

  - title: "Projects"
    url: "/#projects"

  - title: "Publications"
    url: "/#publications"

  - title: "Awards"
    url: "/#awards"

  - title: "Service"
    url: "/#service"
