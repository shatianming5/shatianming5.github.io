<style>
/* =====================================================================
   Refined academic theme — deep navy / slate palette.
   All colours are declared as custom properties so the dark-mode block
   at the bottom of this file only has to re-declare the tokens.
   ===================================================================== */
:root {
  /* Pin the page to the light theme. Without this, a visitor whose OS is in
     dark mode still gets browser-auto-darkened scrollbars/form controls, and
     some browsers apply forced dark mode to the whole document. */
  color-scheme: light;

  /* Warm paper palette. Pure #fff + saturated blue reads like a product
     landing page; journals and research groups use an off-white stock with
     warm ink and a single low-saturation accent. */
  --ink:         #1c1a17;   /* headings — warm near-black    */
  --body:        #38342e;   /* body copy                     */
  --muted:       #746d63;   /* secondary / meta text         */
  --accent:      #8a3324;   /* muted oxblood                 */
  --accent-2:    #a44530;   /* links                         */
  --accent-soft: #f7f0ec;   /* tinted fills                  */
  --accent-line: #e7d6ce;
  --rule:        #e8e2d9;   /* hairlines                     */
  --surface:     #fdfcf9;   /* paper                         */
  --surface-2:   #f7f4ed;
  --gold:        #9a7628;
  --stone-soft:  #f2efe8;   /* neutral chip fill  */
  --stone-line:  #e3ddd2;
  --stone-text:  #5c554b;
  --shadow-sm: 0 1px 2px rgba(28,26,23,.04), 0 1px 3px rgba(28,26,23,.05);
  --shadow-md: 0 4px 6px -2px rgba(28,26,23,.06), 0 12px 28px -10px rgba(28,26,23,.14);
  --radius: 8px;
  --font-read: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

html, body {
  background: var(--surface);
}

body {
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  color: var(--body);
}

/* Serif body copy at a comfortable size and leading. This is the single
   biggest lever on "does this look like something worth reading" -- the
   previous 0.95em sans at 1.75 was cramped and screen-like. */
.page__content {
  font-family: var(--font-read);
  font-size: 1.06em;
  line-height: 1.82;
  color: var(--body);
  letter-spacing: 0.003em;
}

/* Metadata, tags and controls stay in the UI sans so they read as chrome
   rather than as prose. */
.page__content .card-subtitle,
.page__content .venue,
.page__content .service-tag,
.page__content h2,
.masthead, .greedy-nav, .author__urls { font-family: var(--font-ui); }

/* NOTE: scroll offset for the sticky masthead is already handled by the theme
   via `h1:before, .anchor:before { height: $scroll_offset; margin-top: -$scroll_offset }`
   in assets/css/main.scss. Do NOT add display/height/scroll-margin overrides on
   .anchor here -- they stack with that spacer and drag headings off-screen. */

/* ========== Section Headers ========== */
.page__content h1 {
  font-family: var(--font-read);
  font-weight: 600;
  font-size: 1.55em;
  letter-spacing: -0.015em;
  color: var(--ink);
  border-bottom: 1px solid var(--rule);
  padding-bottom: 0.42em;
  margin-top: 1.5em;
  margin-bottom: 0.9em;
  position: relative;
}

/* Short accent segment riding on top of the full-width hairline. */
.page__content h1::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -1px;
  width: 2.6em;
  height: 2px;
  background: var(--accent);
  border-radius: 2px;
}

.page__content h1:first-of-type { margin-top: 0.6em; }

/* Icon rendered as a soft tinted chip rather than a bare glyph.
   inline-flex (not a flex child) so the heading stays display:block and the
   theme's h1:before scroll spacer keeps behaving like a block spacer. */
.page__content h1 .section-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.65em;
  height: 1.65em;
  font-size: 0.6em;
  color: var(--accent);
  background: var(--stone-soft);
  border: 1px solid var(--stone-line);
  border-radius: 6px;
  flex-shrink: 0;
  vertical-align: middle;
  margin-right: 0.55em;
  position: relative;
  top: -0.08em;
}

.page__content h2 {
  font-weight: 600;
  font-size: 0.78em;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  border-bottom: none;
  margin-top: 1.7em;
  margin-bottom: 0.5em;
}

/* ========== About ========== */
.about-text {
  font-size: 1.1em;
  line-height: 1.88;
  color: var(--body);
  padding: 0.2em 0 0.6em;
}

/* ========== Education ========== */
.edu-item {
  display: flex;
  align-items: center;
  gap: 0.7em;
  padding: 0.85em 1.1em;
  background: var(--surface-2);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
}

.edu-item .edu-icon {
  color: var(--accent);
  font-size: 1.05em;
  flex-shrink: 0;
}

/* ========== Cards (Experience / Projects) ========== */
.card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 1.15em 1.35em;
  margin-bottom: 0.85em;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .25s ease, transform .25s ease, border-color .25s ease;
}

.card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
  border-color: var(--accent-line);
}

.card-title {
  font-family: var(--font-read);
  font-weight: 600;
  font-size: 1.1em;
  color: var(--ink);
  margin-bottom: 0.3em;
  letter-spacing: -0.01em;
}

.card-subtitle {
  font-size: 0.85em;
  color: var(--muted);
  margin-bottom: 0.6em;
}

.card-subtitle i { color: var(--accent-2); margin-right: 0.15em; }

.card-desc {
  font-size: 0.93em;
  color: var(--body);
  line-height: 1.7;
  margin: 0;
}

.card-desc a, .card-title a { color: var(--accent-2); font-weight: 600; }

/* ========== Publications ========== */
.pub-list { list-style: none; padding-left: 0; margin-bottom: 0.4em; }

.pub-list li {
  position: relative;
  padding: 0.85em 0.9em 0.85em 1.5em;
  border-bottom: 1px solid var(--rule);
  line-height: 1.7;
  border-radius: 8px;
  transition: background-color .2s ease;
}

.pub-list li:last-child { border-bottom: none; }
.pub-list li:hover { background: var(--surface-2); }

/* Slim accent rule instead of a bullet dot. Aligned to the centre of the
   title's first line, so it stays put when a title wraps to two lines. */
.pub-list li::before {
  content: '';
  position: absolute;
  left: 0.35em;
  top: 1.07em;
  width: 3px;
  height: 1.05em;
  background: var(--accent-line);
  border-radius: 2px;
  transition: background-color .2s ease;
}

.pub-list li:hover::before { background: var(--accent); }

/* The author's own name, bolded in the markup. */
.pub-list li strong { color: var(--accent); }

/* Title-first layout: a reader scans titles, not author strings, so the
   title leads and the byline drops to metadata size beneath it. */
.pub-title {
  font-weight: 600;
  color: var(--ink);
  line-height: 1.45;
}

.pub-authors {
  font-family: var(--font-ui);
  font-size: 0.82em;
  color: var(--muted);
  line-height: 1.55;
  margin-top: 0.3em;
}

.pub-tags { margin-top: 0.5em; }
.pub-tags .venue:first-child { margin-left: 0; }

/* ========== Venue Tags ========== */
.venue {
  display: inline-block;
  background: var(--stone-soft);
  color: var(--stone-text);
  border: 1px solid var(--stone-line);
  font-size: 0.72em;
  font-weight: 600;
  padding: 0.18em 0.6em;
  border-radius: 5px;
  margin-left: 0.25em;
  vertical-align: middle;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.venue.oral     { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); font-weight:700; }
.venue.workshop { background:#eef0f3; color:#5a6472; border-color:#dee2e8; }
.venue.review   { background:#f7f1e4; color:#7d6522; border-color:#e9dec4; }

/* Preprint tags double as the link to arXiv. The a.venue selector is needed
   to out-specify `.page__content a`, which would otherwise recolour them. */
.venue.preprint { font-variant-numeric: tabular-nums; }
.venue i { margin-right: 0.4em; }
.page__content a.venue { color: var(--stone-text); border-bottom: none; }
.page__content a.venue:hover {
  color: var(--accent);
  background: var(--accent-soft);
  border-color: var(--accent-line);
  border-bottom: none;
}

/* Equal-contribution markers. */
.pub-list sup, .pub-note sup { color: var(--accent); font-weight: 700; }
.pub-note {
  font-family: var(--font-ui);
  font-size: 0.8em;
  color: var(--muted);
  margin: 0.6em 0 0;
}

/* ========== Awards ========== */
.award-list { list-style: none; padding-left: 0; }

.award-list li {
  padding: 0.5em 0 0.5em 1.9em;
  position: relative;
  border-bottom: 1px solid transparent;
}

.award-list li::before {
  content: '\f091';
  font-family: 'Font Awesome 5 Free';
  font-weight: 900;
  position: absolute;
  left: 0;
  top: 0.5em;
  color: var(--gold);
  font-size: 0.88em;
}

.award-list li strong { color: var(--ink); }

/* ========== Service Tags ========== */
.service-tags { display: flex; flex-wrap: wrap; gap: 0.45em; margin-top: 0.4em; }

.service-tag {
  display: inline-block;
  background: var(--stone-soft);
  color: var(--stone-text);
  font-size: 0.8em;
  font-weight: 500;
  padding: 0.28em 0.8em;
  border-radius: 20px;
  border: 1px solid var(--stone-line);
  transition: transform .18s ease, box-shadow .18s ease;
}

.service-tag:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.service-tag.journal { background:#edf1e8; color:#4c5c3b; border-color:#dbe2d0; }

/* Bare "Conference Reviewer" / "Journal Reviewer" labels. */
.page__content p > strong:only-child {
  display: inline-block;
  font-size: 0.9em;
  color: var(--muted);
  font-weight: 600;
  margin-top: 0.7em;
}

/* ========== Interview ========== */
.interview-card {
  display: flex;
  align-items: flex-start;
  gap: 1.1em;
  background: linear-gradient(135deg, var(--accent-soft) 0%, var(--surface-2) 100%);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius);
  padding: 1.15em 1.35em;
  box-shadow: var(--shadow-sm);
}

.interview-card .interview-icon { font-size: 1.7em; color: var(--accent); flex-shrink: 0; line-height: 1.2; }
.interview-card .interview-text { font-size: 0.93em; line-height: 1.7; color: var(--body); }
.interview-card .interview-text strong { color: var(--ink); }

/* ========== Sidebar / author profile ========== */
.author__avatar img {
  border: 1px solid var(--rule);
  box-shadow: 0 0 0 4px var(--surface), 0 6px 20px -6px rgba(22,32,44,.28);
  transition: transform .3s ease;
}
.author__avatar img:hover { transform: scale(1.03); }

.author__name {
  font-family: var(--font-read);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
}

/* The sidebar is sticky, so this line is the one piece of text visible at
   every scroll position. It carries the research thesis, not a job title. */
.author__bio {
  font-family: var(--font-read);
  font-size: 0.92em;
  line-height: 1.55;
  color: var(--stone-text);
  margin: 0.5em 0 0;
}

.author__urls.social-icons li {
  padding: 0.32em 0;
  font-size: 0.88em;
  color: var(--muted);
}

.author__urls.social-icons li a { color: var(--body); transition: color .2s ease; }
.author__urls.social-icons li a:hover { color: var(--accent-2); }
.author__urls.social-icons i { color: var(--accent-2); }

/* ========== Masthead ========== */
.masthead { border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(180%) blur(12px); }
.greedy-nav { background: transparent; }
.greedy-nav a { font-size: 0.86em; font-weight: 500; color: var(--body); }
.greedy-nav a:hover { color: var(--accent); }
.greedy-nav .visible-links a::before { background: var(--accent); height: 2px; }

/* ========== Links ========== */
.page__content a {
  color: var(--accent-2);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color .2s, color .2s;
}
.page__content a:hover { color: var(--accent); border-bottom-color: var(--accent); text-decoration: none; }

/* GitHub star shields sit on the text baseline. */
.stars-badge { display: inline; margin: 0 0 -3px 4px; }

/* ========== Entrance animation ========== */
@keyframes riseIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }

.page__content > h1,
.page__content > p,
.page__content > ul,
.page__content > .card,
.page__content > .edu-item,
.page__content > .interview-card,
.page__content > .service-tags { animation: riseIn .5s ease both; }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .page__content h1 { font-size: 1.38em; }
  .card, .interview-card { padding: 0.95em 1.05em; }
  .interview-card { flex-direction: column; gap: 0.6em; }
  .pub-list li { padding-right: 0; }
}

/* ========== Print ========== */
@media print {
  .card, .interview-card, .edu-item { box-shadow: none; border: 1px solid #ccc; }
  .page__content h1 { page-break-after: avoid; }
  .pub-list li { page-break-inside: avoid; }
}
</style>

<!-- end custom head snippets -->
